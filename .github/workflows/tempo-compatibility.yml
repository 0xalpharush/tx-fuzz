name: Tempo localnet compatibility
on:
  push:
    paths: ['tempo/**', '.github/workflows/tempo-compatibility.yml']
  pull_request:
    paths: ['tempo/**', '.github/workflows/tempo-compatibility.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.9'
          cache-dependency-path: tempo/go.sum
      - name: Test offline corpus and comparison tool
        working-directory: tempo
        run: |
          go test -race ./...
          go vet ./...
          go build -o ../tempo-compare ./cmd/tempo-compare
      - name: Install pinned Kurtosis
        timeout-minutes: 3
        run: |
          wget -q --timeout=30 --tries=3 https://github.com/kurtosis-tech/kurtosis-cli-release-artifacts/releases/download/1.20.0/kurtosis-cli_1.20.0_linux_amd64.tar.gz
          echo '3866e805a83a63d3d0b177f54c3fb556066b8c0e12f6442a0579bb7deaa1d5ae  kurtosis-cli_1.20.0_linux_amd64.tar.gz' | sha256sum --check
          tar -xzf kurtosis-cli_1.20.0_linux_amd64.tar.gz kurtosis
      - name: Start independent pinned localnets
        run: ./kurtosis run --enclave tempo-compat-${{ github.run_id }} ./tempo/kurtosis/main.star --args-file ./tempo/kurtosis/images.json 2>&1 | tee kurtosis.log
      - name: Compare valid transactions and state
        run: |
          BASELINE_RPC=$(./kurtosis port print tempo-compat-${{ github.run_id }} baseline rpc)
          CANDIDATE_RPC=$(./kurtosis port print tempo-compat-${{ github.run_id }} candidate rpc)
          ./tempo-compare -baseline-rpc "$BASELINE_RPC" -candidate-rpc "$CANDIDATE_RPC" -seed 1 | tee results.jsonl
      - name: Capture localnet service logs
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: ./kurtosis service logs --all-services --all tempo-compat-${{ github.run_id }} 2>&1 | tee services.log
      - name: Capture container states
        if: always()
        continue-on-error: true
        run: docker ps -aq --filter 'name=baseline--' --filter 'name=candidate--' | xargs -r docker inspect --format '{{.Name}} {{json .State}}' | tee container-states.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tempo-compatibility-evidence
          path: |
            kurtosis.log
            results.jsonl
            services.log
            container-states.log
      - name: Remove only this run's enclave
        if: always()
        run: ./kurtosis enclave rm --force tempo-compat-${{ github.run_id }}
