name: Tempo localnet compatibility
on:
  push:
    branches: [master, centaur/tempo-offline-corpus-20260914]
    paths: ['tempo/**', '.github/workflows/tempo-compatibility.yml']
  pull_request:
    paths: ['tempo/**', '.github/workflows/tempo-compatibility.yml']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.9'
          cache-dependency-path: tempo/go.sum
      - name: Test offline corpus and comparison tool
        working-directory: tempo
        run: |
          go test -race ./...
          go vet ./...
          go build -o ../tempo-compare ./cmd/tempo-compare
      - name: Install pinned Kurtosis
        run: |
          wget -q https://github.com/kurtosis-tech/kurtosis-cli-release-artifacts/releases/download/1.20.0/kurtosis-cli_1.20.0_linux_amd64.tar.gz
          echo '3866e805a83a63d3d0b177f54c3fb556066b8c0e12f6442a0579bb7deaa1d5ae  kurtosis-cli_1.20.0_linux_amd64.tar.gz' | sha256sum --check
          tar -xzf kurtosis-cli_1.20.0_linux_amd64.tar.gz kurtosis
      - name: Start independent pinned localnets
        run: ./kurtosis run --enclave tempo-compat-${{ github.run_id }} ./tempo/kurtosis/main.star 2>&1 | tee kurtosis.log
      - name: Compare valid transactions and state
        run: |
          MAIN_RPC=$(./kurtosis port print tempo-compat-${{ github.run_id }} main rpc)
          EVM2_RPC=$(./kurtosis port print tempo-compat-${{ github.run_id }} evm2 rpc)
          ./tempo-compare -main-rpc "$MAIN_RPC" -evm2-rpc "$EVM2_RPC" -seed 1 | tee results.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tempo-compatibility-evidence
          path: |
            kurtosis.log
            results.jsonl
      - name: Remove only this run's enclave
        if: always()
        run: ./kurtosis enclave rm --force tempo-compat-${{ github.run_id }}
