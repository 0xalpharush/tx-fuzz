name: Tempo localnet compatibility
on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * 1-5'
  push:
    paths: ['tempo/**', '.github/workflows/tempo-compatibility.yml']
  pull_request:
    paths: ['tempo/**', '.github/workflows/tempo-compatibility.yml']
permissions:
  contents: read
concurrency:
  group: tempo-evm-differential
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.9'
          cache-dependency-path: tempo/go.sum
      - name: Test offline corpus and comparison tool
        working-directory: tempo
        run: |
          go test -race ./...
          go vet ./...
          go build ./cmd/tempo-compare ./cmd/tempo-evm-diff ./cmd/tempo-chain-oracle
      - name: Build tx-fuzz service image
        run: docker build -t tx-fuzz-tempo:local ./tempo
      - name: Build pinned txgen with Tempo's maintained benchmark seeds
        env:
          TXGEN_REF: 5ab341ae38a875e9755cb93628af96ee020ebf38
          TEMPO_BENCH_REF: d286839f6f9794a33f6ecf5b30c307f25322b75a
        run: |
          git clone --filter=blob:none https://github.com/tempoxyz/txgen.git txgen-src
          git -C txgen-src checkout --detach "$TXGEN_REF"
          git clone --filter=blob:none --no-checkout https://github.com/tempoxyz/tempo.git tempo-bench-src
          git -C tempo-bench-src sparse-checkout set contrib/bench/txgen
          git -C tempo-bench-src checkout --detach "$TEMPO_BENCH_REF"
          cp -R tempo-bench-src/contrib/bench/txgen txgen-src/examples/tempo-bench
          docker build -t txgen-tempo:local txgen-src
      - name: Install pinned Kurtosis
        timeout-minutes: 3
        run: |
          wget -q --timeout=30 --tries=3 https://github.com/kurtosis-tech/kurtosis-cli-release-artifacts/releases/download/1.20.0/kurtosis-cli_1.20.0_linux_amd64.tar.gz
          echo '3866e805a83a63d3d0b177f54c3fb556066b8c0e12f6442a0579bb7deaa1d5ae  kurtosis-cli_1.20.0_linux_amd64.tar.gz' | sha256sum --check
          tar -xzf kurtosis-cli_1.20.0_linux_amd64.tar.gz kurtosis
      - name: Run one-chain revm versus EVM2 differential soak
        run: ./kurtosis run --enclave tempo-compat-${{ github.run_id }} ./tempo/kurtosis/main.star --args-file ./tempo/kurtosis/images.json 2>&1 | tee kurtosis.log
      - name: Capture localnet service logs
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        run: ./kurtosis service logs --all-services --all tempo-compat-${{ github.run_id }} 2>&1 | tee services.log
      - name: Capture container states
        if: always()
        continue-on-error: true
        run: docker ps -aq --filter 'name=tempo-revm--' --filter 'name=tempo-evm2--' --filter 'name=tx-fuzz--' --filter 'name=txgen--' | xargs -r docker inspect --format '{{.Name}} {{json .State}}' | tee container-states.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tempo-compatibility-evidence
          path: |
            kurtosis.log
            services.log
            container-states.log
      - name: Remove only this run's enclave
        if: always()
        run: ./kurtosis enclave rm --force tempo-compat-${{ github.run_id }}
