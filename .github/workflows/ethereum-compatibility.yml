name: Ethereum revm vs EVM2 state roots

on:
  workflow_dispatch:
  pull_request:
    paths: ['campaigns/**', 'ethereum/**', 'tempo/**', '.github/workflows/ethereum-compatibility.yml']

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.9'
          cache-dependency-path: |
            go.sum
            tempo/go.sum
      - name: Test campaign tools
        run: |
          go test -race ./...
          (cd tempo && go test -race ./...)
      - name: Check out txgen
        run: |
          git clone --filter=blob:none https://github.com/tempoxyz/txgen.git ../txgen
          git -C ../txgen checkout --detach 0d62b7dbf14f338e0fc51750053d2cafe3d55bde
      - name: Install Kurtosis
        run: |
          curl --fail --location --output kurtosis.tar.gz https://github.com/kurtosis-tech/kurtosis-cli-release-artifacts/releases/download/1.20.0/kurtosis-cli_1.20.0_linux_amd64.tar.gz
          echo '3866e805a83a63d3d0b177f54c3fb556066b8c0e12f6442a0579bb7deaa1d5ae  kurtosis.tar.gz' | sha256sum --check
          tar -xzf kurtosis.tar.gz kurtosis
          sudo install kurtosis /usr/local/bin/kurtosis
      - name: Build exact images and package
        run: ./campaigns/prepare-ethereum.sh
      - name: Exercise a continuous campaign window
        run: |
          set +e
          timeout --signal=INT 8m env DURATION=4m ./campaigns/ethereum-state-loop.sh
          status=$?
          set -e
          test "$status" -eq 124 -o "$status" -eq 130
          grep -R '"event":"passed"' campaign-runs/ethereum/*/oracle.jsonl
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ethereum-state-root-evidence
          path: campaign-runs/ethereum/
