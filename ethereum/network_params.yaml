participants:
  - el_type: reth
    el_image: reth-revm:local
    cl_type: lighthouse
  - el_type: reth
    el_image: reth-evm2:local
    cl_type: lighthouse
  - el_type: geth
    cl_type: lighthouse

network_params:
  seconds_per_slot: 4
  genesis_delay: 20

additional_services:
  - tx_spammer
  - el_forkmon

tx_spammer_params:
  tx_spammer_extra_args:
    - "--seed=1"
    - "--accounts=20"
    - "--txcount=2"
    - "--slot-time=4"
    - "--gaslimit=1000000"
