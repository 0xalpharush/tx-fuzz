participants:
  - el_client_type: reth
    el_client_image: reth-revm:local
    cl_client_type: lighthouse
    cl_client_image: sigp/lighthouse:v4.6.0
  - el_client_type: reth
    el_client_image: reth-evm2:local
    cl_client_type: lighthouse
    cl_client_image: sigp/lighthouse:v4.6.0
  - el_client_type: geth
    el_client_image: ethereum/client-go:v1.13.15
    cl_client_type: lighthouse
    cl_client_image: sigp/lighthouse:v4.6.0

network_params:
  seconds_per_slot: 4
  genesis_delay: 20

additional_services:
  - tx_spammer
  - el_forkmon

tx_spammer_params:
  tx_spammer_extra_args:
    - "--seed=1"
    - "--accounts=20"
    - "--txcount=2"
    - "--slot-time=4"
    - "--gaslimit=1000000"
